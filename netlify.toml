[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  targetPort = 3000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200